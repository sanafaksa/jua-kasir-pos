<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf5ee">
<title>Mari Jua Jastip</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: nota-style ledger. Cream ground and rose/brown ink taken from the logo.
   Header = logo + tabs; content max 1080px; form = fields left + sticky bill right;
   nota = receipt paper left + send/payment actions right. */
:root{
  --bg:#faf5ee; --surface:#fffdf9; --surface2:#f4e9de; --line:#e8d9ca; --field:#ffffff;
  --ink:#4b2c25; --ink2:#7d625a;
  --rose:#cf7580; --rose-strong:#ab4753; --rose-soft:#f6dcd9; --on-rose:#ffffff;
  --wa:#1b7f45;
  --good:#2f7a4d; --good-soft:#dcefe2; --warn:#85530a; --warn-soft:#f8e8c9;
  --bad:#a63232; --bad-soft:#f6d9d6; --info:#3f5f8a; --info-soft:#dde7f3;
  --paper:#fffdf9; --paper-ink:#4b2c25; --paper-ink2:#8a6f66; --paper-line:#e3d2c2; --paper-rose:#ab4753; --paper-soft:#f6ebe3;
  --font-display:"Baloo 2","Nunito",system-ui,sans-serif;
  --font-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1d1514; --surface:#291d1b; --surface2:#34251f; --line:#46332e; --field:#1f1614;
  --ink:#f4e8e0; --ink2:#bfa89d;
  --rose:#e48d96; --rose-strong:#eea0a7; --rose-soft:#4a2a2c; --on-rose:#2b1512;
  --good:#8fd3a8; --good-soft:#23382b; --warn:#e9b866; --warn-soft:#3d2f17;
  --bad:#f0988f; --bad-soft:#41231f; --info:#93b5db; --info-soft:#22313f;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1d1514; --surface:#291d1b; --surface2:#34251f; --line:#46332e; --field:#1f1614;
  --ink:#f4e8e0; --ink2:#bfa89d;
  --rose:#e48d96; --rose-strong:#eea0a7; --rose-soft:#4a2a2c; --on-rose:#2b1512;
  --good:#8fd3a8; --good-soft:#23382b; --warn:#e9b866; --warn-soft:#3d2f17;
  --bad:#f0988f; --bad-soft:#41231f; --info:#93b5db; --info-soft:#22313f;
  color-scheme:dark}

*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-block:18px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:30px} h2{font-size:20px;margin-bottom:12px}
p{margin:0}
a{color:var(--rose-strong)}
button{font:inherit;color:inherit}
.muted{color:var(--ink2)} .small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;padding-bottom:18px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;text-decoration:none;color:inherit}
.brand img{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none;border:1px solid var(--line)}
.brand b{display:block;font-family:var(--font-display);font-size:22px;line-height:1.1}
.brand span{font-size:13px;color:var(--ink2)}
.tabs{display:flex;gap:4px;margin-left:auto;overflow-x:auto;max-width:100%;padding:2px}
.tab{padding:8px 14px;border-radius:999px;font-weight:800;color:var(--ink2);text-decoration:none;white-space:nowrap}
.tab:hover{background:var(--surface2)}
.tab[aria-current="page"]{background:var(--rose-soft);color:var(--rose-strong)}
@media(max-width:640px){.tabs{margin-left:0;width:100%}}

/* generic */
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--surface);color:var(--ink);font-weight:800;cursor:pointer;text-decoration:none;line-height:1.2;text-align:center}
.btn:hover{border-color:var(--rose)}
.btn.primary{background:var(--rose-strong);border-color:var(--rose-strong);color:var(--on-rose)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:focus-visible,.in:focus-visible,.tab:focus-visible,.chip:focus-visible,a:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.in{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);font:inherit;min-width:0}
.in::placeholder{color:var(--ink2);opacity:.7}
textarea.in{resize:vertical;min-height:84px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:800;color:var(--ink2);min-width:0}
label.f .in{font-weight:400;color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(max-width:560px){.grid2{grid-template-columns:minmax(0,1fr)}}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.s-baru{background:var(--info-soft);color:var(--info)} .s-dibeli{background:var(--warn-soft);color:var(--warn)}
.s-dikirim{background:var(--rose-soft);color:var(--rose-strong)} .s-selesai{background:var(--good-soft);color:var(--good)}
.s-batal{background:var(--surface2);color:var(--ink2)}
.p-belum{background:var(--bad-soft);color:var(--bad)} .p-dp{background:var(--warn-soft);color:var(--warn)} .p-lunas{background:var(--good-soft);color:var(--good)}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;margin-bottom:16px;display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;font-weight:700}
.empty{text-align:center;padding:34px 18px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty img{width:120px;height:auto;border-radius:50%}

/* dashboard */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.tile{padding:16px 18px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.tile .l{font-size:12px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.tile .v{font-family:var(--font-display);font-size:28px;font-weight:700;line-height:1.2;margin-top:2px;overflow-wrap:anywhere}
.tile.hot{background:var(--rose-soft);border-color:transparent}
.tile.hot .v{color:var(--rose-strong)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media(max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.pipe{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--surface2);margin:4px 0 14px}
.pipe i{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px}
.legend div{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column}
.li-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.li-row:first-child{border-top:0}
a.li-row:hover .nm{color:var(--rose-strong)}
.li-row .nm{font-weight:800;overflow-wrap:anywhere}
.li-row .am{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.li-row .sub{font-size:13px;color:var(--ink2);display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center}
.li-row .act{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:800;font-size:13px;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--rose-strong);border-color:var(--rose-strong);color:var(--on-rose)}

/* form */
.form-grid,.nota-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
@media(max-width:920px){.form-grid,.nota-grid{grid-template-columns:minmax(0,1fr)}}
.sticky{position:sticky;top:16px}
@media(max-width:920px){.sticky{position:static}}
.item{display:grid;grid-template-columns:minmax(0,1fr) 76px minmax(0,150px) 36px;gap:8px;padding:12px 0;border-top:1px dashed var(--line);align-items:center}
.item:first-child{border-top:0;padding-top:0}
.item .nt{grid-column:1/3}
.item .sub{grid-column:3/5;text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.x{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:20px;line-height:1;color:var(--ink2)}
.x:hover{color:var(--bad);border-color:var(--bad)}
@media(max-width:560px){
  .item{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .item .n{grid-column:1/-1}
  .item .nt{grid-column:1/-1}
  .item .x{grid-row:4;grid-column:2;justify-self:end}
  .item .sub{grid-column:1;grid-row:4;text-align:left}
}
.chg{display:grid;grid-template-columns:minmax(0,1fr) 92px minmax(0,130px) 36px;gap:8px;padding:6px 0;align-items:center}
@media(max-width:560px){.chg{grid-template-columns:minmax(0,1fr) 92px;} .chg .cv{grid-column:1} .chg .x{grid-column:2;justify-self:end}}
.sumline{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-variant-numeric:tabular-nums}
.sumline.total{font-family:var(--font-display);font-size:22px;font-weight:700;border-top:2px dashed var(--line);margin-top:8px;padding-top:12px}
.neg{color:var(--bad)}
.err{color:var(--bad);font-weight:700;font-size:13px;min-height:1px}

/* nota paper */
.paper{position:relative;background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);border-radius:6px 6px 0 0;padding:28px 28px 34px;margin-bottom:12px;
  box-shadow:0 20px 30px -24px rgba(75,44,37,.55)}
.paper::after{content:"";position:absolute;left:-1px;right:-1px;bottom:-9px;height:9px;
  background:radial-gradient(circle at 9px 0,var(--paper) 7px,transparent 8px) 0 0/18px 9px repeat-x}
.p-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.p-logo{width:112px;height:auto;border-radius:50%}
.p-meta{text-align:right;font-size:14px;color:var(--paper-ink2)}
.p-title{font-family:var(--font-display);font-size:34px;font-weight:800;color:var(--paper-rose);line-height:1}
.p-no{font-weight:800;color:var(--paper-ink);font-size:16px}
hr.dash{border:0;border-top:2px dashed var(--paper-line);margin:20px 0}
.p-lbl{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--paper-ink2)}
.p-cust{font-family:var(--font-display);font-size:22px;font-weight:700}
.p-it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;padding:7px 0}
.p-it .a{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.p-it .d{font-size:13px;color:var(--paper-ink2);grid-column:1}
.p-row{display:flex;justify-content:space-between;gap:16px;padding:3px 0;font-variant-numeric:tabular-nums}
.p-row.big{font-family:var(--font-display);font-size:24px;font-weight:700;padding-top:8px}
.p-row .neg{color:var(--bad)}
.p-state{display:inline-block;margin-top:10px;padding:3px 14px;border-radius:999px;font-weight:800;font-size:13px;letter-spacing:.04em;border:2px solid currentColor}
.p-state.lunas{color:var(--good)} .p-state.sisa{color:var(--bad)} .p-state.dp{color:var(--warn)}
.p-box{background:var(--paper-soft);border-radius:12px;padding:14px 16px;margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere}
.p-foot{text-align:center;color:var(--paper-rose);font-family:var(--font-display);font-size:18px;font-weight:600;margin-top:20px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.toast{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;z-index:20;
  padding:0 max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.toast div{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:700;max-width:480px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.toast div[hidden]{display:none}
.back{display:inline-flex;margin-bottom:12px;font-weight:800;text-decoration:none}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.tab{transition:background .15s,border-color .15s}}
</style>
</head>

<div class="wrap" id="app"></div>
<div class="toast" role="status" aria-live="polite"><div id="toast" hidden></div></div>

/* ---------- helpers ---------- */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.abs(Math.round(n||0)).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const rp=n=>(n<0?'-':'')+'Rp '+fmt(n);
const num=s=>{const d=String(s==null?'':s).replace(/\D/g,'');return d?Number(d):0};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());
const fdate=s=>{try{return new Date(s+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}catch(e){return s}};
const getSettings=()=>Object.assign({},DEF,S.settings||{});
const find=id=>S.orders.find(o=>o.id===id);
const uid=()=>'o'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const waNum=s=>{let d=String(s||'').replace(/\D/g,'');if(d.startsWith('0'))d='62'+d.slice(1);else if(d.startsWith('8'))d='62'+d;return d};
const waLink=(n,m)=>'https://wa.me/'+waNum(n)+'?text='+encodeURIComponent(m);
const first=n=>String(n||'').trim().split(/\s+/)[0]||'Kak';
const fallbackSaver={save:async({filename,data})=>{
  const b=data instanceof Blob?data:new Blob([data]);
  try{
    const f=new File([b],filename,{type:b.type||'application/octet-stream'});
    if(b.type==='image/png'&&navigator.canShare&&navigator.canShare({files:[f]})){
      try{await navigator.share({files:[f],title:filename});return {status:'saved'}}catch(err){if(err&&err.name==='AbortError')throw {code:'declined'}}
    }
  }catch(err){if(err&&err.code==='declined')throw err}
  const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);return {status:'saved'};
}};
async function getSaver(){try{if(window.claude&&window.claude.use){const d=await window.claude.use('downloads');if(d)return d}}catch(e){}return fallbackSaver}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},2600)}

function totals(o){
  const sub=(o.items||[]).reduce((a,i)=>a+(+i.qty||0)*(+i.price||0),0);
  const ch=(o.charges||[]).map(c=>{const pct=c.kind.endsWith('pct');const base=pct?Math.round(sub*(+c.value||0)/100):Math.round(+c.value||0);return Object.assign({},c,{pct,amt:c.kind[0]==='n'?-base:base})});
  const total=sub+ch.reduce((a,c)=>a+c.amt,0);const paid=+o.paid||0;const sisa=total-paid;
  const pay=paid<=0?'belum':(sisa<=0?'lunas':'dp');
  return {sub,ch,total,paid,sisa,pay};
}
const chLabel=c=>c.label+(c.pct?' ('+(+c.value)+'%)':'');

function nextNo(date){
  const st=getSettings();const pre=st.prefix+'-'+date.slice(2,4)+date.slice(5,7)+'-';
  let mx=0;S.orders.forEach(o=>{if(o.no&&o.no.startsWith(pre)){const n=parseInt(o.no.slice(pre.length),10);if(n>mx)mx=n}});
  return pre+String(mx+1).padStart(3,'0');
}
function newDraft(){
  const st=getSettings(),d=today(),ch=[];
  if(+st.defFee>0)ch.push({label:'Fee jasa',kind:'pct',value:+st.defFee});
  ch.push({label:'Ongkir',kind:'rp',value:0});
  return {id:null,no:nextNo(d),date:d,customer:{name:'',wa:'',address:''},items:[{name:'',note:'',qty:1,price:0}],charges:ch,paid:0,status:'baru',notes:''};
}

/* ---------- messages ---------- */
function msgFor(o,tpl){
  const st=getSettings(),t=totals(o),nm='Kak '+first(o.customer.name);
  const lines=o.items.map((i,k)=>(k+1)+'. '+i.name+(i.note?' ('+i.note+')':'')+'\n    '+i.qty+' x '+rp(i.price)+' = '+rp(i.qty*i.price));
  const pay=st.pay?'\n\nPembayaran ke:\n'+st.pay:'';
  const foot=st.foot?'\n\n'+st.foot:'';
  if(tpl==='tagih'){
    return 'Halo '+nm+', mengingatkan tagihan jastip *'+o.no+'* ya.\n\nTotal: '+rp(t.total)+'\nSudah dibayar: '+rp(t.paid)+'\n*Sisa tagihan: '+rp(t.sisa)+'*'+pay+'\n\nKalau sudah transfer, mohon kirim bukti bayarnya ya. Terima kasih!';
  }
  if(tpl==='kirim'){
    return 'Halo '+nm+', pesanan jastip *'+o.no+'* sudah kami kirim / siap diambil.\n\nKabari kami kalau barang sudah diterima ya. Terima kasih sudah jastip di '+st.biz+'!';
  }
  let m='*INVOICE '+st.biz.toUpperCase()+'*\nNo: '+o.no+'\nTanggal: '+fdate(o.date)+'\n\nHalo '+nm+', ini rincian jastipnya ya:\n\n'+lines.join('\n')+'\n\nSubtotal barang: '+rp(t.sub);
  t.ch.forEach(c=>{m+='\n'+chLabel(c)+': '+rp(c.amt)});
  m+='\n*TOTAL: '+rp(t.total)+'*';
  if(t.paid>0)m+='\nSudah dibayar: '+rp(t.paid);
  m+=t.sisa<=0?'\n*LUNAS*':'\n*Sisa tagihan: '+rp(t.sisa)+'*';
  if(t.sisa>0)m+=pay;
  if(o.notes)m+='\n\nCatatan: '+o.notes;
  return m+foot;
}

async function initStore(){
  const slow=setTimeout(()=>{if(!S.ready){S.ready=true;S.slow=true;route()}},10000);
  let c=null;
  try{c=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){c=null}
  db=c;
  if(!db){clearTimeout(slow);loadLocal();S.ready=true;route();return}
  db.doc('config/main').onSnapshot(snap=>{
    S.settings=snap.exists?snap.data():null;sSettingsExists=snap.exists;
    if(snap.metadata.fromCache===false)sSettingsDef=true;
    maybeSeed();softRender();
  },e=>{console.warn(e)});
  db.collection('orders').onSnapshot(snap=>{
    S.orders=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
    if(snap.metadata.fromCache===false)sOrdersDef=true;
    if(!S.ready){S.ready=true;clearTimeout(slow);route()}else softRender();
    maybeSeed();
  },e=>{console.warn(e)});
}
function maybeSeed(){
  if(seedDone||!sSettingsDef||!sOrdersDef||sSettingsExists)return;
  seedDone=true;
  (async()=>{
    try{
      await db.doc('config/main').set(Object.assign({},DEF,{seeded:true}));
      if(!S.orders.length){for(const o of sampleOrders())await db.doc('orders/'+o.id).set(o)}
    }catch(e){console.warn(e)}
  })();
}
async function saveOrder(o){
  const c=JSON.parse(JSON.stringify(o));
  const i=S.orders.findIndex(x=>x.id===c.id);if(i>=0)S.orders[i]=c;else S.orders.push(c);
  if(db){await db.doc('orders/'+c.id).set(c)}else{persistLocal();softRender()}
}
async function removeOrder(id){
  S.orders=S.orders.filter(o=>o.id!==id);
  if(db){await db.doc('orders/'+id).delete()}else{persistLocal()}
}
async function saveSettings(s){
  S.settings=Object.assign({},s);
  if(db){await db.doc('config/main').set(JSON.parse(JSON.stringify(s)))}else{persistLocal()}
}

/* ---------- routing / rendering ---------- */
function route(){
  const h=location.hash.slice(1)||'ringkasan';
  S.confirmDel=false;S.err='';
  if(h.startsWith('nota-')){S.view='nota';S.id=h.slice(5);S.tpl='invoice';S.msg=null}
  else if(h.startsWith('ubah-')){S.view='buat';S.editId=h.slice(5)}
  else if(h==='buat'){S.view='buat';S.editId=null;if(!S.draft||S.draft.id)S.draft=null}
  else if(['ringkasan','pesanan','setelan'].includes(h)){S.view=h}
  else S.view='ringkasan';
  render();window.scrollTo(0,0);
}
function softRender(){if(!S.ready)return;if(S.view==='buat'||S.view==='setelan')return;render()}
window.addEventListener('hashchange',route);

function head(){
  const st=getSettings(),v=S.view;
  const tab=(h,l,on)=>'<a class="tab" href="#'+h+'"'+(on?' aria-current="page"':'')+'>'+l+'</a>';
  return '<header class="top"><a class="brand" href="#ringkasan"><img src="'+LOGO+'" alt="Logo '+esc(st.biz)+'"><div><b>'+esc(st.biz)+'</b><span>Pesanan &amp; invoice</span></div></a><nav class="tabs" aria-label="Menu">'
    +tab('ringkasan','Ringkasan',v==='ringkasan')+tab('buat','Pesanan baru',v==='buat'&&!S.editId)+tab('pesanan','Semua pesanan',v==='pesanan'||v==='nota')+tab('setelan','Pengaturan',v==='setelan')+'</nav></header>';
}
function banners(){
  let h='';
  if(S.slow)h+='<div class="notice">Data dari server belum bisa dijangkau, jadi tampilan ini mungkin belum yang terbaru.</div>';
  if(S.orders.some(o=>o.sample))h+='<div class="notice"><span>Pesanan bertanda "contoh" adalah data contoh supaya Anda bisa mencoba.</span><button class="btn sm" data-act="clear-sample">Hapus data contoh</button></div>';
  return h;
}
function render(){
  let html;
  if(!S.ready)html='<div class="card empty"><img src="'+LOGO+'" alt=""><p class="muted">Memuat data pesanan...</p></div>';
  else if(S.view==='ringkasan')html=viewDash();
  else if(S.view==='buat')html=viewForm();
  else if(S.view==='pesanan')html=viewList();
  else if(S.view==='nota')html=viewNota();
  else html=viewSettings();
  app.innerHTML=head()+(S.ready?banners():'')+html;

}

/* ---------- list ---------- */
function listRows(){
  const q=S.q.trim().toLowerCase(),f=S.filter;
  const match=o=>{
    if(f==='belum'){if(o.status==='batal'||totals(o).sisa<=0)return false}

    if(!q)return true;
    return (o.customer.name+' '+o.no+' '+(o.customer.wa||'')+' '+o.items.map(i=>i.name).join(' ')).toLowerCase().includes(q);
  };
  const rows=S.orders.filter(match).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||byNew(a,b));

}

function updateSum(){
  const d=S.draft;if(!d)return;const t=totals(d);

  t.ch.forEach(c=>{if(c.label||c.amt)h+='<div class="sumline"><span>'+esc(chLabel(c)||'Biaya')+'</span><span class="'+(c.amt<0?'neg':'')+'">'+rp(c.amt)+'</span></div>'});
  h+='<div class="sumline total"><span>Total</span><span>'+rp(t.total)+'</span></div>';
  h+='<div class="sumline"><span>Sisa tagihan</span><span><span class="pill p-'+t.pay+'">'+PAY[t.pay]+'</span> <b>'+rp(Math.max(0,t.sisa))+'</b></span></div>';
  el.innerHTML=h;

function setPath(o,p,v){const k=p.split('.');let x=o;for(let i=0;i<k.length-1;i++)x=x[k[i]];x[k[k.length-1]]=v}
function fmtMoney(el){
  const pos=el.selectionStart==null?el.value.length:el.selectionStart;
  const before=el.value.slice(0,pos).replace(/\D/g,'').length;
  const f=fmt(num(el.value));const out=num(el.value)?f:'';
  el.value=out;let c=0,i=0;for(;i<out.length&&c<before;i++){if(/\d/.test(out[i]))c++}
  try{el.setSelectionRange(i,i)}catch(e){}
}
async function submitOrder(){
  const d=S.draft;const err=m=>{S.err=m;const e=document.getElementById('err');if(e)e.textContent=m};
  if(!d.customer.name.trim())return err('Isi nama pelanggan dulu.');
  const items=d.items.filter(i=>String(i.name).trim()||+i.price).map(i=>({name:String(i.name).trim(),note:String(i.note||'').trim(),qty:+i.qty||0,price:+i.price||0}));
  if(!items.length)return err('Tambahkan minimal satu barang.');
  if(items.some(i=>!i.name))return err('Ada barang yang belum diberi nama.');
  if(items.some(i=>i.qty<1))return err('Jumlah barang minimal 1.');
  if(!String(d.no).trim())return err('Nomor invoice tidak boleh kosong.');
  const charges=d.charges.filter(c=>String(c.label).trim()||+c.value).map(c=>({label:String(c.label).trim()||'Biaya',kind:c.kind,value:+c.value||0}));
  const o=Object.assign({},d,{id:d.id||uid(),no:String(d.no).trim(),items,charges,paid:+d.paid||0,customer:{name:d.customer.name.trim(),wa:d.customer.wa.trim(),address:d.customer.address.trim()},createdAt:d.createdAt||Date.now()});
  delete o.sample;if(d.sample)o.sample=true;
  try{await saveOrder(o)}catch(e){return err('Pesanan belum tersimpan. Coba lagi sebentar lagi.')}
  S.draft=null;S.editId=null;S.err='';toast('Pesanan tersimpan');
  location.hash='nota-'+o.id;
}

/* ---------- invoice image ---------- */
async function invoiceBlob(o){
  const st=getSettings(),t=totals(o);
  try{await Promise.all([document.fonts.load('800 30px "Baloo 2"'),document.fonts.load('600 18px "Baloo 2"'),document.fonts.load('400 16px Nunito'),document.fonts.load('800 16px Nunito')])}catch(e){}
  const logo=await new Promise(r=>{const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src=LOGO});
  const W=900,P=56,SC=2,B='Nunito, system-ui, sans-serif',D='"Baloo 2", Nunito, system-ui, sans-serif';
  const C={paper:'#fffdf9',ink:'#4b2c25',ink2:'#8a6f66',line:'#e3d2c2',rose:'#cf7580',roseS:'#ab4753',soft:'#f6ebe3',good:'#2f7a4d',bad:'#a63232',warn:'#85530a'};
  const wrap=(c,text,maxW)=>{const out=[];String(text).split('\n').forEach(par=>{let line='';par.split(' ').forEach(w=>{const test=line?line+' '+w:w;if(c.measureText(test).width>maxW&&line){out.push(line);line=w}else line=test});out.push(line)});return out};
  const rr=(c,x,y,w,h,r)=>{c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()};
  function paint(c){
    let y=0;c.textBaseline='alphabetic';
    c.fillStyle=C.rose;c.fillRect(0,0,W,12);y=46;
    let lh=0;if(logo){lh=Math.round(120*logo.height/logo.width);c.save();c.beginPath();c.arc(P+60,y+lh/2,60,0,Math.PI*2);c.clip();c.drawImage(logo,P,y,120,lh);c.restore()}
    c.textAlign='right';c.fillStyle=C.roseS;c.font='800 44px '+D;c.fillText('INVOICE',W-P,y+46);
    c.fillStyle=C.ink;c.font='800 19px '+B;c.fillText(o.no,W-P,y+80);
    c.fillStyle=C.ink2;c.font='400 16px '+B;c.fillText(fdate(o.date),W-P,y+104);
    if(st.wa)c.fillText('WA '+st.wa,W-P,y+126);
    c.textAlign='left';y+=Math.max(lh,130)+26;
    const dash=()=>{c.strokeStyle=C.line;c.lineWidth=2;c.setLineDash([7,7]);c.beginPath();c.moveTo(P,y);c.lineTo(W-P,y);c.stroke();c.setLineDash([]);y+=30};
    dash();
    c.fillStyle=C.ink2;c.font='800 13px '+B;c.fillText('DITAGIHKAN KEPADA',P,y);y+=28;
    c.fillStyle=C.ink;c.font='700 26px '+D;c.fillText(o.customer.name,P,y);y+=26;
    c.font='400 16px '+B;
    if(o.customer.wa){c.fillStyle=C.ink;c.fillText(o.customer.wa,P,y);y+=22}
    if(o.customer.address){c.fillStyle=C.ink2;wrap(c,o.customer.address,W-2*P).forEach(l=>{c.fillText(l,P,y);y+=22})}
    y+=6;dash();
    o.items.forEach(i=>{
      c.font='800 18px '+B;const nl=wrap(c,i.name,W-2*P-190);
      c.fillStyle=C.ink;nl.forEach((l,k)=>{c.fillText(l,P,y+k*24)});
      c.textAlign='right';c.fillText(rp(i.qty*i.price),W-P,y);c.textAlign='left';
      y+=(nl.length-1)*24+23;
      c.font='400 15px '+B;c.fillStyle=C.ink2;
      wrap(c,i.qty+' x '+rp(i.price)+(i.note?'  -  '+i.note:''),W-2*P-190).forEach(l=>{c.fillText(l,P,y);y+=21});
      y+=12;
    });
    y-=4;dash();
    const row=(l,v,font,col)=>{c.font=font;c.fillStyle=col||C.ink;c.textAlign='left';c.fillText(l,P,y);c.textAlign='right';c.fillText(v,W-P,y);c.textAlign='left'};
    row('Subtotal barang',rp(t.sub),'400 18px '+B);y+=28;
    t.ch.forEach(ch=>{row(chLabel(ch),rp(ch.amt),'400 18px '+B,ch.amt<0?C.bad:C.ink);y+=28});
    y+=8;row('Total',rp(t.total),'700 30px '+D);y+=34;
    if(t.paid>0){row('Sudah dibayar',rp(t.paid),'400 18px '+B);y+=28}
    if(t.sisa>0){row('Sisa tagihan',rp(t.sisa),'800 19px '+B);y+=14}
    y+=10;
    const label=t.sisa<=0?'LUNAS':(t.paid>0?'BELUM LUNAS':'BELUM DIBAYAR'),col=t.sisa<=0?C.good:(t.paid>0?C.warn:C.bad);
    c.font='800 16px '+B;const bw=c.measureText(label).width+40;
    rr(c,P,y,bw,34,17);c.strokeStyle=col;c.lineWidth=2.5;c.stroke();c.fillStyle=col;c.fillText(label,P+20,y+23);y+=34+26;
    if(t.sisa>0&&st.pay){
      c.font='400 17px '+B;const pl=wrap(c,st.pay,W-2*P-40),bh=pl.length*24+62;
      rr(c,P,y,W-2*P,bh,14);c.fillStyle=C.soft;c.fill();
      c.fillStyle=C.ink2;c.font='800 13px '+B;c.fillText('CARA PEMBAYARAN',P+20,y+30);
      c.fillStyle=C.ink;c.font='400 17px '+B;pl.forEach((l,k)=>c.fillText(l,P+20,y+58+k*24));y+=bh+22;
    }
    if(o.notes){c.fillStyle=C.ink2;c.font='800 13px '+B;c.fillText('CATATAN',P,y);y+=24;c.fillStyle=C.ink;c.font='400 17px '+B;wrap(c,o.notes,W-2*P).forEach(l=>{c.fillText(l,P,y);y+=24});y+=14}
    if(st.foot){c.textAlign='center';c.fillStyle=C.roseS;c.font='600 21px '+D;wrap(c,st.foot,W-2*P).forEach(l=>{c.fillText(l,W/2,y+8);y+=28});c.textAlign='left'}
    return y+44;
  }
  const mc=document.createElement('canvas').getContext('2d');
  const H=Math.ceil(paint(mc));
  const cv=document.createElement('canvas');cv.width=W*SC;cv.height=H*SC;
  const c=cv.getContext('2d');c.scale(SC,SC);c.fillStyle=C.paper;c.fillRect(0,0,W,H);paint(c);
  return new Promise(r=>cv.toBlob(r,'image/png'));
}


/* ---------- export excel ---------- */
async function exportXlsx(list,filename){
  if(!window.XLSX){toast('Fitur Excel belum termuat. Periksa koneksi internet lalu muat ulang.');return}
  if(!list.length){toast('Belum ada pesanan untuk diekspor.');return}
  const rows=list.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.no||'').localeCompare(b.no||''));
  const D=s=>new Date(s+'T00:00:00');
  const h1=['No Invoice','Tanggal','Pelanggan','No WhatsApp','Alamat','Subtotal Barang','Biaya Tambahan','Rincian Biaya','Total','Dibayar','Sisa Tagihan','Status Pesanan','Status Bayar','Catatan'];
  const a1=rows.map(o=>{const t=totals(o);return [o.no,D(o.date),o.customer.name,o.customer.wa||'',o.customer.address||'',t.sub,t.total-t.sub,t.ch.map(c=>chLabel(c)+' '+rp(c.amt)).join('; '),t.total,t.paid,t.sisa,STATUS[o.status],o.status==='batal'?'-':PAY[t.pay],o.notes||'']});
  const live=rows.filter(o=>o.status!=='batal').map(totals);
  const sm=f=>live.reduce((a,t)=>a+f(t),0);
  const tot=['TOTAL (tanpa pesanan batal)','','','','',sm(t=>t.sub),sm(t=>t.total-t.sub),'',sm(t=>t.total),sm(t=>t.paid),sm(t=>t.sisa),'','',''];
  const ws1=XLSX.utils.aoa_to_sheet([h1].concat(a1,[tot]),{cellDates:true});
  ws1['!cols']=[16,12,22,16,30,16,16,36,16,14,14,16,14,30].map(w=>({wch:w}));
  ws1['!autofilter']={ref:'A1:N'+(a1.length+1)};
  const h2=['No Invoice','Tanggal','Pelanggan','Barang','Catatan Barang','Jumlah','Harga Satuan','Subtotal','Status Pesanan'];
  const a2=[];rows.forEach(o=>o.items.forEach(i=>a2.push([o.no,D(o.date),o.customer.name,i.name,i.note||'',+i.qty||0,+i.price||0,(+i.qty||0)*(+i.price||0),STATUS[o.status]])));
  const ws2=XLSX.utils.aoa_to_sheet([h2].concat(a2),{cellDates:true});
  ws2['!cols']=[16,12,22,36,26,10,16,16,16].map(w=>({wch:w}));
  ws2['!autofilter']={ref:'A1:I'+(a2.length+1)};
  const fmtCol=(ws,col,z,n)=>{for(let r=1;r<=n;r++){const c=ws[XLSX.utils.encode_cell({r,c:col})];if(c&&(c.t==='n'||c.t==='d'))c.z=z}};
  fmtCol(ws1,1,'dd/mm/yyyy',a1.length);[5,6,8,9,10].forEach(c=>fmtCol(ws1,c,'#,##0',a1.length+1));
  fmtCol(ws2,1,'dd/mm/yyyy',a2.length);[6,7].forEach(c=>fmtCol(ws2,c,'#,##0',a2.length));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws1,'Pesanan');XLSX.utils.book_append_sheet(wb,ws2,'Rincian Barang');
  const out=XLSX.write(wb,{bookType:'xlsx',type:'array',cellDates:true});
  const blob=new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  try{const dl=await getSaver();await dl.save({filename,data:blob});toast('File Excel siap')}
  catch(err){if(!err||err.code!=='declined')toast('File Excel belum bisa disimpan.')}
}

/* ---------- events ---------- */
app.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){S.q=t.value;const lb=document.getElementById('listbox');if(lb){const keep=S.view;const tmp=document.createElement('div');tmp.innerHTML=viewList();const nb=tmp.querySelector('#listbox');if(nb)lb.innerHTML=nb.innerHTML}return}
  if(t.dataset.act==='msg'){S.msg=t.value;const a=document.getElementById('waBtn'),o=find(S.id);if(a&&o)a.href=waLink(o.customer.wa,S.msg);return}
  if(S.view!=='buat'||!S.draft)return;
  const d=S.draft;
  if(t.hasAttribute('data-money'))fmtMoney(t);
  if(t.dataset.path!==undefined){setPath(d,t.dataset.path,t.value);if(t.dataset.path==='status')return}
  else if(t.dataset.paid!==undefined){d.paid=num(t.value)}
  else if(t.dataset.i!==undefined){const it=d.items[+t.dataset.i],k=t.dataset.k;it[k]=(k==='qty'||k==='price')?num(t.value):t.value}
  else if(t.dataset.c!==undefined&&t.dataset.k!=='kind'){const c=d.charges[+t.dataset.c],k=t.dataset.k;c[k]=k==='value'?(c.kind.endsWith('pct')?(parseFloat(t.value)||0):num(t.value)):t.value}
  else return;
  updateSum();
});
app.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='f-status'&&S.draft){S.draft.status=t.value;return}
  if(t.dataset.c!==undefined&&t.dataset.k==='kind'){const c=S.draft.charges[+t.dataset.c];const wasPct=c.kind.endsWith('pct');c.kind=t.value;if(wasPct!==c.kind.endsWith('pct'))c.value=0;document.getElementById('charges').innerHTML=chargesHtml();updateSum();return}
  if(t.dataset.act==='status'){const o=find(S.id);if(o)nextOrderUpdate(o,{status:t.value});return}
  if(t.dataset.act==='restore'){
    const f=t.files&&t.files[0];if(!f)return;
    try{
      const j=JSON.parse(await f.text());const list=Array.isArray(j)?j:j.orders;
      if(!Array.isArray(list))throw new Error('bad');
      let n=0;for(const o of list){if(!o||!o.customer||!Array.isArray(o.items))continue;o.id=o.id||uid();o.charges=o.charges||[];o.status=STATUS[o.status]?o.status:'baru';await saveOrder(o);n++}
      toast(n+' pesanan dipulihkan');
    }catch(err){toast('File cadangan tidak bisa dibaca.')}
    t.value='';
  }
});
app.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='TEXTAREA'||b.tagName==='SELECT'||b.tagName==='INPUT')return;
  const act=b.dataset.act,d=S.draft;
  if(act==='export-all'){exportXlsx(listRows(),'Pesanan-MariJuaJastip-'+today()+'.xlsx');return}
  if(act==='export-one'){const o=find(S.id);if(o)exportXlsx([o],'Pesanan-'+o.no+'.xlsx');return}
  if(act==='filter'){S.filter=b.dataset.v;render();return}
  if(act==='add-item'){d.items.push({name:'',note:'',qty:1,price:0});document.getElementById('items').innerHTML=itemsHtml();updateSum();const all=app.querySelectorAll('#items .n');if(all.length)all[all.length-1].focus();return}
  if(act==='del-item'){if(d.items.length>1)d.items.splice(+b.dataset.idx,1);else d.items[0]={name:'',note:'',qty:1,price:0};document.getElementById('items').innerHTML=itemsHtml();updateSum();return}
  if(act==='add-charge'){const p=b.dataset.p;const c=p==='Fee jasa'?{label:p,kind:'pct',value:+getSettings().defFee||10}:p==='Diskon'?{label:p,kind:'nrp',value:0}:{label:p,kind:'rp',value:0};d.charges.push(c);document.getElementById('charges').innerHTML=chargesHtml();updateSum();return}
  if(act==='del-charge'){d.charges.splice(+b.dataset.idx,1);document.getElementById('charges').innerHTML=chargesHtml();updateSum();return}
  if(act==='pay-full'){d.paid=totals(d).total;const i=document.getElementById('f-paid');i.value=d.paid?fmt(d.paid):'';updateSum();return}
  if(act==='save-order'){submitOrder();return}
  if(act==='tpl'){const o=find(S.id);S.tpl=b.dataset.v;S.msg=msgFor(o,S.tpl);render();return}
  if(act==='copy'){
    const ta=document.getElementById('msg');
    try{await navigator.clipboard.writeText(S.msg);toast('Pesan disalin')}catch(err){ta.focus();ta.select();toast('Pesan dipilih. Tekan Salin di keyboard Anda.')}
    return;
  }
  if(act==='img'){
    const o=find(S.id);const dl=await getSaver();
    try{
      const blob=await invoiceBlob(o);
      await dl.save({filename:'Invoice-'+o.no+'-'+first(o.customer.name)+'.png',data:blob});
      toast('Nota siap. Lampirkan gambarnya di chat WhatsApp.');
    }catch(err){if(!err||err.code!=='declined')toast('Nota belum bisa disimpan sebagai gambar.')}
    return;
  }
  if(act==='pay-add'){const o=find(S.id),v=num(document.getElementById('payIn').value);if(!v){toast('Isi nominal pembayaran dulu.');return}nextOrderUpdate(o,{paid:(+o.paid||0)+v});toast('Pembayaran dicatat');return}
  if(act==='pay-lunas'){const o=find(S.id);nextOrderUpdate(o,{paid:totals(o).total});toast('Ditandai lunas');return}
  if(act==='del-ask'){S.confirmDel=true;render();return}
  if(act==='del-no'){S.confirmDel=false;render();return}
  if(act==='del-yes'){const id=S.id;try{await removeOrder(id);toast('Pesanan dihapus');location.hash='pesanan'}catch(err){toast('Belum terhapus. Coba lagi.')}return}
  if(act==='clear-sample'){
    const ids=S.orders.filter(o=>o.sample).map(o=>o.id);
    try{for(const id of ids)await removeOrder(id);toast('Data contoh dihapus');render()}catch(err){toast('Belum terhapus. Coba lagi.')}
    return;
  }
  if(act==='save-settings'){
    const g=i=>document.getElementById(i).value;
    const s=Object.assign({},getSettings(),{biz:g('s-biz').trim()||DEF.biz,wa:g('s-wa').trim(),prefix:(g('s-prefix').trim()||DEF.prefix).replace(/\s+/g,''),defFee:Math.max(0,parseFloat(g('s-fee'))||0),pay:g('s-pay'),foot:g('s-foot'),seeded:true});
    try{await saveSettings(s);toast('Pengaturan tersimpan');render()}catch(err){toast('Pengaturan belum tersimpan.')}
    return;
  }
  if(act==='backup'){
    const dl=await getSaver();
    try{await dl.save({filename:'mari-jua-jastip-cadangan-'+today()+'.json',data:JSON.stringify({settings:getSettings(),orders:S.orders},null,2)});toast('Cadangan disimpan')}catch(err){if(!err||err.code!=='declined')toast('Cadangan belum bisa disimpan.')}
    return;
  }
});

initStore();
</script>

</body>
</html>
